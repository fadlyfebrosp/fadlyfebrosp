<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 280" width="1260" height="280">
    <style>
        .fade-in { opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-right { opacity: 0; animation: slideRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .card-border { transition: stroke 0.3s ease; }
        g:hover .card-border { stroke: #22D3EE; }
        .link-text { transition: fill 0.2s ease; cursor: pointer; }
        .link-text:hover { fill: #38BDF8; text-decoration: underline; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideRight {
            0% { opacity: 0; transform: translateX(-15px); }
            100% { opacity: 1; transform: translateX(0); }
        }
    </style>
    <rect width="1260" height="280" fill="#0D1117"/>
    
    <!-- Top Terminal Header -->
    <text x="20" y="30" fill="#22D3EE" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">SUPPORT.LIST</text>
    <text x="150" y="30" fill="#8B949E" font-family="monospace" font-size="13">./donate.sh --all</text>
    <rect x="310" y="19" width="8" height="14" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <g class="fade-in delay-1">
