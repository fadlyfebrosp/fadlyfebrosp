</circle>
<text x="1170" y="180" fill="#F0F6FC" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0; 1" begin="1.3s" dur="0.8s" fill="freeze"/>100%</text>
