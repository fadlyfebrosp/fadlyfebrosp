    <style>
        .fade-in { opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-right { opacity: 0; animation: slideRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .t-del-1-1 { animation-delay: 0.4s; }
        .t-del-1-2 { animation-delay: 0.7s; }
        .t-del-2-1 { animation-delay: 0.6s; }
        .t-del-2-2 { animation-delay: 0.9s; }
        .card { transition: transform 0.3s ease; transform-origin: center; }
        .card:hover { transform: translateY(-5px); cursor: pointer; }
        .card-border { transition: stroke 0.3s ease; }
        .card:hover .card-border { stroke: #22D3EE; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideRight {
            0% { opacity: 0; transform: translateX(-15px); }
            100% { opacity: 1; transform: translateX(0); }
        }
    </style>
